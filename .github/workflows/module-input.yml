name: Read-only module input
on:
  push:
    branches: ['integration/host-safety-notifications']
    paths:
      - 'research/ae-notifications/Copy-Research-Modules.command'
      - 'tests/research/test_module_copy.py'
      - '.github/workflows/module-input.yml'
  pull_request:
    paths:
      - 'research/ae-notifications/Copy-Research-Modules.command'
      - 'tests/research/test_module_copy.py'
      - '.github/workflows/module-input.yml'
permissions:
  contents: read
jobs:
  copy-only:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Syntax and actual copy launcher on owned files (not AE)
        run: |
          bash -n research/ae-notifications/Copy-Research-Modules.command
          python3 -B -m unittest discover -s tests/research -p test_module_copy.py -v
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=normal)"
