name: Integration gate
on:
  push:
    branches: ['integration/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Core and adapter regression
        run: npm test
      - name: Host and research regression
        run: |
          if test -d tests/runtime; then node --test tests/runtime/*.test.mjs; fi
          if test -d tests/research; then python3 -m unittest discover -s tests/research -p 'test_*.py'; fi
      - name: CEP build
        run: npm run check:cep
      - name: Package integrity
        run: |
          if test -f scripts/verify-cep.mjs; then node scripts/verify-cep.mjs; fi
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=normal)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: FSTR-Line-integration-${{ github.sha }}
          path: cep
          if-no-files-found: error
