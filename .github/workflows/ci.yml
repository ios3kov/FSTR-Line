name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify clean Git state
        run: test -z "$(git status --porcelain --untracked-files=normal)"
      - name: Syntax check
        run: npm run check
      - name: Unit tests
        run: npm test
      - name: Core performance baseline
        run: npm run benchmark:core
      - name: Upload core performance baseline
        uses: actions/upload-artifact@v4
        with:
          name: FSTR-Line-Core-Performance
          path: artifacts/core-performance-baseline.json
          if-no-files-found: error
      - name: Verify benchmark left source tree clean
        run: test -z "$(git status --porcelain --untracked-files=normal)"
      - name: Package extension
        run: npm run package:dev
      - name: Verify clean package
        run: npm run verify:package
      - name: Verify source tree stayed clean
        run: test -z "$(git status --porcelain --untracked-files=normal)"
      - name: Upload clean CEP artifact
        uses: actions/upload-artifact@v4
        with:
          name: FSTR-Line-CEP
          path: dist/FSTR-Line
          if-no-files-found: error
