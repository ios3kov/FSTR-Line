name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Verify clean Git state
        run: test -z "$(git status --porcelain --untracked-files=normal)"
      - name: Syntax check
        run: npm run check
      - name: Unit tests
        run: npm test
      - name: Phase 0 static code/security audit
        run: npm run audit:phase0
      - name: Upload Phase 0 static audit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: FSTR-Line-Phase0-Static-Audit
          path: artifacts/phase0-static-audit.json
          if-no-files-found: warn
      - name: Core performance baseline
        run: npm run benchmark:core
      - name: Upload core performance baseline
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: FSTR-Line-Core-Performance
          path: artifacts/core-performance-baseline.json
          if-no-files-found: error
      - name: Verify benchmark left source tree clean
        run: |
          git status --short --untracked-files=normal
          test -z "$(git status --porcelain --untracked-files=normal)"
      - name: Package extension
        run: npm run package:dev
      - name: Verify clean package
        run: npm run verify:package
      - name: Verify source tree stayed clean
        run: |
          git status --short --untracked-files=normal
          test -z "$(git status --porcelain --untracked-files=normal)"
      - name: Upload clean CEP artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: FSTR-Line-CEP
          path: dist/FSTR-Line
          if-no-files-found: error
